# SECURITY FIXTURE — DELIBERATELY VULNERABLE WORKFLOW
# This file is a test fixture for Trent's agentic deployment automation posture
# analysis. It contains deliberately planted vulnerabilities. Do NOT use this
# as a template for real workflows.
#
# PLANTED FINDINGS:
#   VULN-CI-001: pull_request_target + checkout of PR head + agent execution
#   VULN-CI-007: contents: write permission allows agent to modify workflow files
#   VULN-CI-005 (partial): anthropics/claude-code-action@v1 is a floating tag

name: Claude Code PR Review

on:
  # VULN-CI-001: pull_request_target runs in the base repo context, with base-repo
  # secrets and GITHUB_TOKEN. When combined with a checkout of the PR head below,
  # attacker-controlled code from the fork executes with elevated privileges.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    # VULN-CI-007: contents: write means Claude Code can write to .github/workflows/
    # and modify its own workflow — a workflow self-modification vector.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # VULN-CI-001 (continued): Checking out the PR head ref of a fork PR means
          # the agent reads and executes attacker-controlled files (e.g., skill files
          # in .claude/skills/ that Claude Code loads at startup).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude Code review
        # VULN-CI-005: Floating tag @v1 — not pinned to a commit SHA.
        # A supply-chain compromise of anthropics/claude-code-action could replace
        # this tag with malicious code that exfiltrates GITHUB_TOKEN and secrets.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the job's GITHUB_TOKEN rather than the OIDC app-token exchange,
          # which fails without id-token: write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The @claude trigger phrase means any PR commenter can invoke the agent.
          trigger_phrase: "@claude"
          # Claude Code will read .claude/skills/ from the checked-out head — which
          # is the attacker's version of those files when the PR is from a fork.
          claude_args: "--max-turns 20"
