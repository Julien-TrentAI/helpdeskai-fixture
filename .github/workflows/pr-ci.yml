name: PR CI

# pull_request, not pull_request_target: a fork PR then runs with a read-only
# token and no secrets, so its code cannot use this workflow's permissions.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run integration tests
        run: poetry run pytest tests/ -v

  enable-auto-merge:
    name: enable-auto-merge
    needs: integration-tests
    # Auto-merge only a Trent remediation loop's own pull request: same
    # repository (never a fork), the loop branch, the routine's machine user.
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'trent/loop-')
          && github.event.pull_request.user.login == 'Julien-TrentAI' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash

